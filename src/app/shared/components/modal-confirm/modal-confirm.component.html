<div class="modal-confirm">
  <p class="title">{{ config()?.title }}</p>
  <p class="description">{{ config()?.description }}</p>

  <div class="footer">
    <button
      nz-button
      nzSize="large"
      [nzDanger]="config()?.cancel?.danger"
      class="w-min"
      (click)="cancel()"
    >
      {{ config()?.cancel?.title }}
    </button>

    <button
      nz-button
      nzType="primary"
      nzSize="large"
      [nzDanger]="config()?.submit?.danger"
      class="w-min"
      (click)="submit()"
    >
      {{ config()?.submit?.title }}
    </button>
  </div>
</div>
