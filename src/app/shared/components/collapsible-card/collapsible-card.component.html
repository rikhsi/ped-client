<div class="collapsible-card" [class.expanded]="isOpen()">
  <div class="card-header" (click)="toggle.emit()">
    <div class="header-content">
      <ng-content select="[header]"></ng-content>
    </div>
    <div class="expand-icon">
      <span
        nz-icon
        nzType="o:right"
        style="color: #9aa0ac; font-size: 14px"
      ></span>
    </div>
  </div>

  @if (isOpen()) {
    <div class="card-body">
      <ng-content></ng-content>
    </div>
  }
</div>
