<ng-container *transloco="let t">
  <div [ngClass]="{ cursor: mayOpen() }" class="item-file" (click)="open()">
    <img [src]="icon()" />

    <div class="textes">
      <div>
        <p class="name">{{ name() ?? t("file.unknown") }}</p>
      </div>
      <p class="type">{{ type() }}</p>
    </div>
  </div>
</ng-container>
