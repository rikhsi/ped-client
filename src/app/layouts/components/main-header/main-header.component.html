<ng-container *transloco="let t">
  <div class="left-section">
    <ped-logo  routerLink="/landing" />

    <div class="pages">
      <ped-menu-item
        [prefixIcon]="'o:slider'"
        [label]="t('modules.applications.title')"
        [link]="'/main/applications'"
      />

      <ped-menu-item
        [prefixIcon]="'o:book'"
        [label]="t('modules.certificates.title')"
        [link]="'/main/certificates'"
      />
    </div>
  </div>

  <div class="actions">
    <a
      href="https://t.me/Pedagoguzedu"
      target="_blank"
      rel="noopener noreferrer"
      nz-button
      class="header-btn telegram-btn"
    >
      <span nz-icon nzType="f:telegram" class="icon"></span>
      <span class="text">{{ t("telegram") }}</span>
    </a>
    <a
      href="https://t.me/Pedagoguzedu"
      target="_blank"
      rel="noopener noreferrer"
      nz-button
      class="header-btn telegram-btn mobile-telegram"
    >
      <span nz-icon nzType="f:telegram" class="icon"></span>
    </a>

    <a href="https://sinov.uz" target="_blank" rel="noopener noreferrer">
      <button nz-button class="header-btn malaka-btn">
        <span nz-icon nzType="o:check" class="icon"></span>
        <span class="text">{{ t("malakaTesti") }}</span>
      </button>
    </a>

    <ped-language-menu (languageChange)="langChange.emit($event)" />

    <button
      nz-button
      nzSize="large"
      nz-dropdown
      [nzDropdownMenu]="notificationMenu"
      nzTrigger="click"
      nzPlacement="bottomRight"
      class="border ripple notification-btn"
    >
      <span nz-icon nzType="o:notification"></span>
    </button>
  </div>

  <nz-dropdown-menu #notificationMenu="nzDropdownMenu">
    <ped-main-notification [items]="notificationList()" />
  </nz-dropdown-menu>
</ng-container>
