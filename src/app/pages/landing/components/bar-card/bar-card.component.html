<div class="card">
  <div class="bar-list">
    @for (region of sortedData(); track region.regionName; let i = $index) {
      <div class="bar-item">
        <span class="bar-number">{{ i + 1 }}.</span>
        <span class="bar-label">{{ region.regionName }}</span>
        <div class="bar-container">
          <div class="bar" [style.width]="getBarWidth(region.totalCount)">
            <span class="bar-value">{{ region.totalCount }}</span>
          </div>
        </div>
      </div>
    }
  </div>
</div>
