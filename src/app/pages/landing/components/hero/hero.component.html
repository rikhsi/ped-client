<ng-container *transloco="let t">
  <section class="hero">
    <img
      class="hero-bg"
      ngSrc="images/main.webp"
      alt="Hero background"
      priority
      fill
      sizes="(max-width: 768px) 100vw, 100vw"
      (load)="imageLoaded()"
      [pedSkeleton]="true"
    />

    @if (showOverlay()) {
      <div class="hero-overlay"></div>
    }

    <div class="info-box">
      <h1>{{ t("hero.text") }}</h1>
      <p>{{ t("hero.subtext") }}</p>
    </div>
  </section>
</ng-container>
