<ng-container *transloco="let t">
  <div class="box-wrapper">
    <div class="container">
      <div class="top">
        <h1 class="title">{{ t("modules.certificates.title") }}</h1>
      </div>

      <div class="content">
        <ped-box-infinite
          [showContent]="!!items()?.length"
          [isLoading]="false"
          [emptyTitle]="'empty.certificates'"
        >
          @for (certificate of items(); track certificate.id) {
            <ped-certificate-card
              [serialNumber]="
                certificate.serial.serialKey + '-' + certificate.number
              "
              [givenDate]="certificate.givenDate"
              [expireDate]="certificate.expireDate"
              [isEndless]="certificate.isEndless"
              [downloadApi]="caService.downloadCertificate$(certificate.id)"
              [category]="certificate.serial.category"
              [subject]="certificate.subject.name"
              [showDownload]="certificate.isDownloadable"
            />
          }
        </ped-box-infinite>
      </div>
    </div>
  </div>
</ng-container>
