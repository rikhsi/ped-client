<ng-container *transloco="let t">
  <div class="modal-verification">
    <div class="modal-header">
      <h3>{{ t(data.label) }}</h3>
      <button nz-button class="border-none" (click)="close()">
        <span nz-icon nzType="o:x"></span>
      </button>
    </div>

    <div class="modal-body">
      <form [formGroup]="form">
        <div class="step-input">
          <p class="current-value">
            {{ t("prop.current_item") }}:
            <strong>{{ data.currentValue }}</strong>
          </p>

          <ped-input-default
            formControlName="newValue"
            [placeholder]="data.fieldType | fieldConfig: 'placeholder'"
            [type]="'text'"
            [mask]="data.fieldType | fieldConfig: 'mask'"
            [required]="true"
          />

          <button
            nz-button
            class="primary full-width"
            (click)="onVerify()"
            [disabled]="form.get('newValue')?.invalid"
          >
            {{ isSubmitting() ? t("prop.checking") : t("action.submit") }}
          </button>
        </div>
