<div class="profile-self" *transloco="let t">
  <div class="avatar-section">
    <nz-avatar
      [nzSrc]="user()?.passport?.photoUrl | src"
      [nzIcon]="'user'"
      class="avatar"
    />
  </div>

  <div class="info-section">
    <h3 class="name">{{ user() | fullname }}</h3>
    <p class="role">{{ t("Pedagog") }}</p>

    <div class="contact-info">
      @if (user()?.phoneNumber; as phoneNumber) {
        <div class="contact-item">
          <span nz-icon nzType="o:phone" class="icon"></span>
          <span class="text">{{ phoneNumber | phoneNumber }}</span>
        </div>
      }
      @if (user()?.email; as email) {
        <div class="contact-item">
          <span nz-icon nzType="o:sms" class="icon"></span>
          <span class="text">{{ email }}</span>
        </div>
      }
      @if (user()?.telegramUserName; as telegram) {
        <div class="contact-item">
          <span nz-icon nzType="f:telegram" class="icon"></span>
          <span class="text">{{ telegram }}</span>
        </div>
      }
    </div>
  </div>

  <div class="actions">
    <button
      *pedEditBtnEnable="status()"
      nz-button
      nzType="primary"
      class="edit"
      (click)="onEdit.emit()"
    >
      <span nz-icon nzType="o:edit"></span>
      {{ t("action.edit") }}
    </button>

    <button
      *pedCancelBtnEnable="status()"
      nz-button
      nzType="primary"
      class="cancel"
      (click)="onCancel.emit()"
    >
      <span nz-icon nzType="o:x"></span>
      {{ t("action.cancel_app") }}
    </button>
  </div>
</div>
